<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Hiragana Master Pro</title>
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --primary: #6c5ce7; --success: #00b894; --error: #d63031; --text: #2d3436; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        .app-container { background: var(--card); width: 100%; max-width: 500px; height: 100vh; padding: 2rem; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; overflow-y: auto; }
        @media (min-height: 600px) { .app-container { height: auto; min-height: 90vh; border-radius: 24px; } }
        
        .hidden { display: none !important; }
        button { padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: 0.2s; margin-bottom: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        
        .status-bar { display: flex; justify-content: space-between; background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .main-char { font-size: clamp(60px, 15vw, 90px); color: var(--primary); font-weight: bold; margin: 20px 0; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 1.2rem; text-align: center; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        
        .rank-tab-btns { display: flex; gap: 5px; margin-bottom: 10px; }
        .rank-tab-btns button { flex: 1; padding: 8px; font-size: 0.8rem; }
        .active-tab { background: var(--primary) !important; color: white !important; }
        
        .ranking-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .ranking-table td { padding: 8px; border-bottom: 1px solid #f1f1f1; }
        .feedback { font-weight: bold; margin: 10px 0; min-height: 24px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="screen-menu">
            <h1 style="margin-bottom: 5px;">Hiragana Master</h1>
            <p style="color: #636e72;">Seu app de sobrevivência em Japonês</p>
            
            <div style="display: grid; gap: 5px;">
                <button class="btn-primary" onclick="startMode('chars')">Desafio das Letras</button>
                <button class="btn-outline" onclick="toggleWordsMenu()">Desafio das Palavras</button>
            </div>
            
            <div id="words-menu" class="hidden" style="margin-top: 10px; background: #eeefff; padding: 15px; border-radius: 12px;">
                <p style="margin: 0 0 10px 0; font-size: 0.9rem;">Responder em:</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" style="flex:1" onclick="startMode('words', 'pt')">Português</button>
                    <button class="btn-primary" style="flex:1" onclick="startMode('words', 'jp')">Japonês</button>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <div class="rank-tab-btns">
                    <button id="tab-chars" class="btn-outline active-tab" onclick="switchRankTab('chars')">Ranking Letras</button>
                    <button id="tab-words" class="btn-outline" onclick="switchRankTab('words')">Ranking Palavras</button>
                </div>
                <table class="ranking-table">
                    <thead><tr><th>#</th><th>Nome</th><th>Acertos</th></tr></thead>
                    <tbody id="rank-rows"></tbody>
                </table>
            </div>
        </div>

        <div id="screen-game" class="hidden">
            <div class="status-bar">
                <div id="life-icons">❤️❤️❤️</div>
                <div>Acertos: <b id="hit-count">0</b></div>
            </div>
            <div id="category-tag" style="text-transform: uppercase; font-size: 0.7rem; color: #95a5a6;">CATEGORIA</div>
            <div class="main-char" id="char-display">あ</div>
            <div id="input-area">
                <input type="text" id="answer-input" placeholder="Digite aqui..." autocomplete="off">
                <button class="btn-primary" style="width: 100%" onclick="checkAnswer()">Validar</button>
            </div>
            <div id="next-area" class="hidden">
                <button class="btn-primary" style="width: 100%; background: #f39c12;" onclick="nextQuestion()">Continuar ➔</button>
            </div>
            <div id="msg-feedback" class="feedback"></div>
        </div>

        <div id="screen-over" class="hidden">
            <h2 style="color: var(--error)">Fim de Jogo!</h2>
            <p>Score final: <b id="final-hits">0</b></p>
            <input type="text" id="player-name" placeholder="Seu Nome">
            <button class="btn-primary" style="width: 100%" onclick="saveRanking()">Salvar Pontuação</button>
            <button class="btn-outline" style="width: 100%" onclick="resetToMenu()">Voltar ao Início</button>
        </div>
    </div>

    <script>
        // --- GERADORES E DADOS ---
        const KANAS = [{q:'あ', a:'a'}, {q:'い', a:'i'}, {q:'う', a:'u'}, {q:'え', a:'e'}, {q:'お', a:'o'}, {q:'か', a:'ka'}, {q:'き', a:'ki'}, {q:'く', a:'ku'}, {q:'け', a:'ke'}, {q:'こ', a:'ko'}, {q:'さ', a:'sa'}, {q:'し', a:'shi'}, {q:'す', a:'su'}, {q:'せ', a:'se'}, {q:'そ', a:'so'}, {q:'た', a:'ta'}, {q:'ち', a:'chi'}, {q:'つ', a:'tsu'}, {q:'て', a:'te'}, {q:'と', a:'to'}, {q:'な', a:'na'}, {q:'に', a:'ni'}, {q:'ぬ', a:'nu'}, {q:'ね', a:'ne'}, {q:'の', a:'no'}, {q:'は', a:'ha'}, {q:'ひ', a:'hi'}, {q:'ふ', a:'fu'}, {q:'へ', a:'he'}, {q:'ほ', a:'ho'}, {q:'ま', a:'ma'}, {q:'み', a:'mi'}, {q:'む', a:'mu'}, {q:'め', a:'me'}, {q:'も', a:'mo'}, {q:'や', a:'ya'}, {q:'ゆ', a:'yu'}, {q:'よ', a:'yo'}, {q:'ら', a:'ra'}, {q:'り', a:'ri'}, {q:'る', a:'ru'}, {q:'れ', a:'re'}, {q:'ろ', a:'ro'}, {q:'わ', a:'wa'}, {q:'を', a:'wo'}, {q:'ん', a:'n'}];
        
        function generateNumbers() {
            const units = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'];
            const romajiUnits = ['', 'ichi', 'ni', 'san', 'yon', 'go', 'roku', 'nana', 'hachi', 'kyuu'];
            const ptUnits = ['', 'um', 'dois', 'tres', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
            let nums = [];
            for(let i=1; i<=100; i++) {
                if(i === 100) { nums.push({q:'ひゃく', pt:'cem', jp:'hyaku', cat:'Número'}); continue; }
                let hir = '', rom = '', pt = '';
                if(i < 10) { hir = units[i]; rom = romajiUnits[i]; pt = ptUnits[i]; }
                else {
                    let d = Math.floor(i/10), u = i%10;
                    hir = (d > 1 ? units[d] : '') + 'じゅう' + units[u];
                    rom = (d > 1 ? romajiUnits[d] : '') + 'juu' + romajiUnits[u];
                    // Para PT vamos simplificar o numeral ou manter o nome
                    pt = i.toString(); 
                }
                nums.push({q:hir, pt:pt, jp:rom, cat:'Número'});
            }
            return nums;
        }

        const WORDS_DB = [
            ...generateNumbers(),
            // Familia (Própria/Terceiros)
            {q:'ちち', pt:'meu pai', jp:'chichi', cat:'Familia (Uchi)'}, {q:'おとうさん', pt:'pai dele', jp:'otousan', cat:'Familia (Soto)'},
            {q:'はは', pt:'minha mae', jp:'haha', cat:'Familia (Uchi)'}, {q:'おかあさん', pt:'mae dela', jp:'okaasan', cat:'Familia (Soto)'},
            {q:'あに', pt:'meu irmao mais velho', jp:'ani', cat:'Familia (Uchi)'}, {q:'おにいさん', pt:'irmao mais velho dele', jp:'oniisan', cat:'Familia (Soto)'},
            {q:'そふ', pt:'meu avo', jp:'sofu', cat:'Familia (Uchi)'}, {q:'おじいさん', pt:'avo dele', jp:'ojiisan', cat:'Familia (Soto)'},
            // Alimentos (Amostra do banco de 50+)
            {q:'ごはん', pt:'arroz', jp:'gohan', cat:'Alimento'}, {q:'にんじん', pt:'cenoura', jp:'ninjin', cat:'Legume'},
            {q:'りんご', pt:'maca', jp:'ringo', cat:'Fruta'}, {q:'みず', pt:'agua', jp:'mizu', cat:'Bebida'},
            {q:'にく', pt:'carne', jp:'niku', cat:'Alimento'}, {q:'たまご', pt:'ovo', jp:'tamago', cat:'Alimento'},
            // Cores
            {q:'あか', pt:'vermelho', jp:'aka', cat:'Cor'}, {q:'あお', pt:'azul', jp:'ao', cat:'Cor'},
            {q:'みどり', pt:'verde', jp:'midori', cat:'Cor'}, {q:'きいろ', pt:'amarelo', jp:'kiiro', cat:'Cor'}
        ];

        // --- LÓGICA ---
        let state = { mode: '', sub: '', current: null, globalErrors: 0, localTries: 3, hits: 0, cooldown: [] };
        let rankings = { chars: JSON.parse(localStorage.getItem('rank_chars')) || [], words: JSON.parse(localStorage.getItem('rank_words')) || [] };

        function startMode(m, s = '') {
            state = { mode: m, sub: s, hits: 0, globalErrors: 0, localTries: 3, cooldown: [] };
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            nextQuestion();
        }

        function nextQuestion() {
            const list = state.mode === 'chars' ? KANAS : WORDS_DB;
            let picked = null;
            while(!picked) {
                let temp = list[Math.floor(Math.random() * list.length)];
                if(!state.cooldown.includes(temp.q)) picked = temp;
            }
            state.current = picked;
            state.localTries = 3;
            state.cooldown.push(picked.q);
            if(state.cooldown.length > 15) state.cooldown.shift();

            document.getElementById('char-display').textContent = picked.q;
            document.getElementById('category-tag').textContent = picked.cat || 'Hiragana';
            document.getElementById('answer-input').value = '';
            document.getElementById('msg-feedback').textContent = '';
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('next-area').classList.add('hidden');
            updateStats();
        }

        function checkAnswer() {
            const raw = document.getElementById('answer-input').value.trim().toLowerCase();
            if(!raw) return;
            const input = raw.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            let correct = (state.mode === 'chars' ? state.current.a : state.current[state.sub]);
            let normCorrect = correct.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

            if(input === normCorrect) {
                state.hits++;
                speak(state.current.q);
                document.getElementById('msg-feedback').textContent = "Correto! 🎉";
                document.getElementById('msg-feedback').style.color = "var(--success)";
                setTimeout(nextQuestion, 1000);
            } else {
                state.localTries--;
                if(state.localTries > 0) {
                    document.getElementById('msg-feedback').textContent = `Incorreto! (${state.localTries} chances)`;
                    document.getElementById('msg-feedback').style.color = "var(--error)";
                } else {
                    state.globalErrors++;
                    speak(state.current.q);
                    document.getElementById('msg-feedback').textContent = `Fim das chances! Era: ${correct.toUpperCase()}`;
                    document.getElementById('input-area').classList.add('hidden');
                    updateStats();
                    if(state.globalErrors >= 3) setTimeout(() => showGameOver(), 2000);
                    else document.getElementById('next-area').classList.remove('hidden');
                }
            }
        }

        function showGameOver() {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-over').classList.remove('hidden');
            document.getElementById('final-hits').textContent = state.hits;
        }

        function saveRanking() {
            const name = document.getElementById('player-name').value || "Jogador";
            const listKey = state.mode; // 'chars' ou 'words'
            rankings[listKey].push({ name, score: state.hits });
            rankings[listKey].sort((a, b) => b.score - a.score);
            localStorage.setItem(`rank_${listKey}`, JSON.stringify(rankings[listKey]));
            resetToMenu();
        }

        function renderRanking(type) {
            const rows = rankings[type].slice(0, 5).map((r, i) => `<tr><td>${i+1}º</td><td>${r.name}</td><td>${r.score}</td></tr>`).join('');
            document.getElementById('rank-rows').innerHTML = rows || '<tr><td colspan="3">Sem recordes</td></tr>';
        }

        function switchRankTab(type) {
            document.getElementById('tab-chars').classList.toggle('active-tab', type === 'chars');
            document.getElementById('tab-words').classList.toggle('active-tab', type === 'words');
            renderRanking(type);
        }

        function resetToMenu() {
            document.getElementById('screen-over').classList.add('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
            renderRanking('chars');
        }

        function speak(t) { const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; window.speechSynthesis.speak(u); }
        function toggleWordsMenu() { document.getElementById('words-menu').classList.toggle('hidden'); }
        function updateStats() {
            const hearts = '❤️'.repeat(3 - state.globalErrors) + '🖤'.repeat(state.globalErrors);
            document.getElementById('life-icons').textContent = hearts;
            document.getElementById('hit-count').textContent = state.hits;
        }

        // Inicialização
        renderRanking('chars');
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
